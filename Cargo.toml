[package]
name = "fluids"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19", default-features = false, features = ["bevy_winit", "bevy_sprite", "bevy_core_pipeline", "bevy_asset", "bevy_log", "bevy_window", "multi_threaded", "std", "bevy_sprite_render", "png"] }

# Bevy is unusably slow in an unoptimised build, but optimising our own crate
# too would make edit-compile-run slow. Optimise the dependencies hard, this
# crate lightly.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
