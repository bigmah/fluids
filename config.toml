# Everything tunable in the simulation. Every field is optional -- delete any
# line to get the default back, or delete the whole file to get all of them.
# Unknown or out-of-range fields are refused at startup rather than ignored.
#
# Pass a different file as the first argument: `cargo run --release -- big.toml`

[scene]
scenario = "wave"
time_scale = 1.0
# Let successive swells travel to the reef. R restarts; S slows playback.
replay_after = 0.0

[swell]
# Direction of TRAVEL in degrees: 0 = +X toward the reef, positive = toward +Z.
# The offshore wavemaker supports -60..60 degrees; the reef does not rotate.
direction = 0.0
# Offshore crest-to-trough height in world units (not height above sea level).
height = 40.0
# Simulation seconds between crests. Longer periods also need deeper/wider water.
period = 1.8

[wave]
# Still-water depth offshore and rise of the submerged reef, in world units.
water_depth = 190.0
reef_height = 174.0
# Fractions of world.width: a deep approach followed by a short, steep rise.
reef_start = 0.30
reef_width = 0.24
# Change in reef X per unit Z, so the lip can break progressively along the reef.
reef_skew = 0.12
# Shoreward damping beach, as a fraction of world.width. Reduces reflected wash.
beach_width = 0.22

[world]
# World units are arbitrary: heights and depths share these units, time is seconds.
# This preset's gravity sets its scale. For meters use gravity = [0, -9.81, 0]
# and rescale all lengths, particle spacing, and input settings consistently.
width = 1100.0
height = 320.0
depth = 360.0
gravity = [0.0, -700.0, 0.0]

[fluid]
# DAM BREAK ONLY: particles along x, y and z in the starting block. It starts
# in a corner and collapses, so more of it means a deeper pool.
#
# This is cubed, not squared: adding 20% to each side is 1.7x the particles.
# Solver cost, measured on an M4 Pro (10 performance cores):
#
#   [18, 20, 18] =  6480 particles    4.6 ms/step   0.6% compression
#   [24, 26, 24] = 14976 particles    7.1 ms/step   1.9% compression
#   [30, 29, 30] = 26100 particles   10.1 ms/step   3.2% compression
#   [39, 29, 39] = 44109 particles   15.6 ms/step   5.5% compression  (full tank)
#
# The solver holds 60fps across all of those, but it is only half the frame:
# surface reconstruction and shading also add a frame cost. These historical
# timings cover only the solver. Compression climbing with size is the
# deeper pool -- more hydrostatic load for the same iteration count, so raise
# solver.iterations alongside if you want it back down.
#
# The startup check reports the largest block that fits if you overshoot.
block = [24, 26, 24]

# RESOLUTION. Rest distance between neighbouring particles. Halving this packs
# EIGHT times as many particles into the same water in 3D. It is the expensive
# knob, and it does not stand alone -- see the two notes below.
spacing = 8.0

# How far a particle looks for neighbours. What matters is the RATIO to
# `spacing`, which sets the neighbour count and with it the solver's whole
# calibration, so change the two together. 2.0x is about 33 neighbours; the 2D
# default of 2.4x would be 58 here, nearly twice the cost for no visible gain.
smoothing_radius = 16.0

[solver]
# Solver steps per frame. The one to raise when you lower `spacing` or deepen
# the block: peak speed comes from gravity and drop height, not from
# resolution, so a smaller kernel means a particle covers more of it per step.
# Let it get too low and the fluid explodes -- so the startup check refuses the
# combination and tells you what to set this to.
substeps = 1

# Jacobi iterations per substep. The deeper wave tank needs more passes than
# the dam break to carry pressure through the water and preserve the swell.
iterations = 16

# Under-relaxation on the positional correction. Jacobi updates every particle
# against stale neighbours, so applying the full correction overshoots and the
# fluid detonates. Values above 0.55 are refused; even 0.5 with only 4
# iterations shows a 3000 units/s transient.
jacobi_relax = 0.5

# Constraint force mixing, as a fraction of the lattice gradient reference.
# Softens the constraint so free-surface particles don't get huge multipliers.
relaxation = 0.05

# XSPH viscosity. Low here so the swell survives the offshore approach; higher
# values damp the wave before it can reach the reef.
viscosity = 0.02

# The wave preset resolves compression only. Keep artificial pressure OFF
# with this mode so unsupported surface particles are not pushed apart.
tensile_k = 0.0
tensile_q = 0.2
tensile_n = 4

# Resolve compression only, so the free surface can rise, stretch, and overturn.
# Pair this with tensile_k = 0. Solid walls and the reef receive density support
# in the wave scene. The dam-break defaults retain their original calibration.
clamp_constraint = true

# Fraction of tangential velocity kept when a particle touches a wall. 1.0 is
# frictionless, 0.0 makes walls sticky.
wall_friction = 1.0

[render]
# Continuous 3D water surface. Smaller cells resolve the lip more finely but
# cost more CPU time. P toggles the particle diagnostic; B toggles tank bounds.
surface_resolution = 0.85
show_bounds = false
# Spray droplet size multiplier; 2.4 is the reference size. This does not
# change the reconstructed water surface.
particle_scale = 2.4

# Foam visibility calibration (legacy field name). Lower makes more of the
# solver's aeration indicator visible. Fast coherent water stays clear.
foam_speed = 700.0

# sRGB, 0..1. Deep absorption/scattering, sunlit water, and aerated foam.
background = [0.67, 0.80, 0.87]
deep_color = [0.015, 0.16, 0.20]
mid_color = [0.08, 0.58, 0.53]
foam_color = [0.92, 0.98, 1.00]

# Cap the frame rate to the display. Turn it off to see what a frame actually
# costs: with it on, the title's ms/frame just reads your refresh interval.
vsync = true

[input]
# Radius of the mouse's influence, in world units, and the velocity change per
# second at its centre.
#
# A radial push in an incompressible fluid is mostly cancelled by the density
# constraint -- only the free surface is free to move -- so the strength is far
# larger than the speeds it produces. Measured, held at this radius:
#
#    4000 -> peak  604 u/s, surface lifts 13 units
#   10000 -> peak  ~900 u/s
#   30000 -> peak 1984 u/s
#
# Past about 1140 u/s a particle crosses more than a kernel radius per step and
# outruns its own neighbour list, so shoving harder than that is self-defeating
# unless you raise solver.substeps to match.
mouse_radius = 110.0
mouse_strength = 10000.0
